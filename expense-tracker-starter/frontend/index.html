<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <nav class="navbar navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="#">Expense Tracker</a>
    </div>
  </nav>
  <div id="loadingSpinner" class="text-center my-4 d-none">
    <div class="spinner-border" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>
  <div id="alertContainer" class="container mt-3"></div>
  <div class="container mt-4">
    <div class="summary-grid">

      <div>
        <div class="card">
          <div class="card-body">
            <h5 class="card-title">Total Amount</h5>
            <p id="totalAmount" class="card-text">0</p>
          </div>
        </div>
      </div>

      <div>
        <div class="card">
          <div class="card-body">
            <h5 class="card-title">Number of Expenses</h5>
            <p id="expenseCount" class="card-text">0</p>
          </div>
        </div>
      </div>

      <div>
        <div class="card">
          <div class="card-body">
            <h5 class="card-title">Highest Expense</h5>
            <p id="highestExpense" class="card-text">0</p>
          </div>
        </div>
      </div>

    </div>
  </div>
  <div class="container mt-4">

    <div class="card shadow-sm">
      <div class="card-body">

        <h3 class="mb-4">Add Expense</h3>

        <form id="expenseForm">

          <div class="row">

            <div class="col-md-3 mb-3">
              <label for="title" class="form-label">Title</label>

              <input type="text" id="title" class="form-control">

              <small id="titleError" class="text-danger"></small>
            </div>

            <div class="col-md-3 mb-3">
              <label for="amount" class="form-label">Amount</label>

              <input type="number" id="amount" class="form-control">

              <small id="amountError" class="text-danger"></small>
            </div>
            <div class="col-md-3 mb-3">
              <label for="category" class="form-label">Category</label>

              <select id="category" class="form-select">
                <option value="">Select Category</option>
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Bills">Bills</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Other">Other</option>
              </select>

              <small id="categoryError" class="text-danger"></small>
            </div>

            <div class="col-md-3 mb-3">
              <label for="date" class="form-label">Date</label>

              <input type="date" id="date" class="form-control">

              <small id="dateError" class="text-danger"></small>
            </div>

          </div>

          <button type="submit" class="btn btn-primary">
            Add Expense
          </button>

        </form>

      </div>

    </div>
    <div class="container mt-4">

      <label for="categoryFilter" class="form-label">
        <h3> Filter by Category</h3>
      </label>

      <select id="categoryFilter" class="form-select">
        <option value="All">All</option>
        <option value="Food">Food</option>
        <option value="Transport">Transport</option>
        <option value="Bills">Bills</option>
        <option value="Entertainment">Entertainment</option>
        <option value="Other">Other</option>
      </select>

    </div>

    <div class="container mt-4 mb-5">

      <div class="card shadow-sm">
        <div class="card-body">

          <h3 class="mb-4">Expenses</h3>

          <div class="table-responsive">
            <table class="table table-hover">

              <thead>
                <tr>
                  <th class="sortable" data-sort="title">Title ↕</th>
                  <th class="sortable" data-sort="amount">Amount ↕</th>
                  <th class="sortable" data-sort="category">Category ↕</th>
                  <th class="sortable" data-sort="date">Date ↕</th>
                  <th>Actions</th>
                </tr>
              </thead>

              <tbody id="expensesTableBody">
                <!-- JavaScript will add the rows here -->
              </tbody>

            </table>
          </div>

        </div>
      </div>

    </div>
    <div class="modal fade" id="editModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">

          <div class="modal-header">
            <h5 class="modal-title">Edit Expense</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>

          <div class="modal-body">

            <form id="editForm">

              <div class="mb-3">
                <label for="editTitle" class="form-label">Title</label>
                <input type="text" id="editTitle" class="form-control">
                <small id="editTitleError" class="text-danger"></small>
              </div>

              <div class="mb-3">
                <label for="editAmount" class="form-label">Amount</label>
                <input type="number" id="editAmount" class="form-control">
                <small id="editAmountError" class="text-danger"></small>
              </div>

              <div class="mb-3">
                <label for="editCategory" class="form-label">Category</label>
                <select id="editCategory" class="form-select">
                  <option value="">Select Category</option>
                  <option value="Food">Food</option>
                  <option value="Transport">Transport</option>
                  <option value="Bills">Bills</option>
                  <option value="Entertainment">Entertainment</option>
                  <option value="Other">Other</option>
                </select>
                <small id="editCategoryError" class="text-danger"></small>
              </div>

              <div class="mb-3">
                <label for="editDate" class="form-label">Date</label>
                <input type="date" id="editDate" class="form-control">
                <small id="editDateError" class="text-danger"></small>
              </div>

            </form>

          </div>

          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
              Cancel
            </button>

            <button type="submit" form="editForm" class="btn btn-primary">
              Save Changes
            </button>
          </div>

        </div>
      </div>
    </div>
    <!-- Delete Confirmation Modal -->
    <div class="modal fade" id="deleteModal" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">

          <div class="modal-header">
            <h5 class="modal-title">Delete Expense</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>

          <div class="modal-body">
            Are you sure you want to delete this expense?
          </div>

          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
              Cancel
            </button>

            <button type="button" class="btn btn-danger" id="confirmDeleteBtn">
              Delete
            </button>
          </div>

        </div>
      </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
